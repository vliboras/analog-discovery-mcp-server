[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analog-discovery-mcp-server"
version = "0.1.0"
description = "MCP server for Digilent Analog Discovery devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Analog Discovery MCP Server contributors" }
]
keywords = ["analog-discovery", "digilent", "waveforms", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1.0",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/vliboras/analog-discovery-mcp-server"
Issues = "https://github.com/vliboras/analog-discovery-mcp-server/issues"

[project.scripts]
analog-discovery-mcp-server = "analog_discovery_mcp.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analog_discovery_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "hardware: requires Digilent WaveForms SDK and connected Analog Discovery hardware",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src", "tests"]
